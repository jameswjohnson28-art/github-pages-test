<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guildhall — Staff Portal</title>
<style>
:root{--bg:#0e0a10;--panel:#1c1420;--panel2:#271a2c;--ink:#f5e7c8;--muted:#b9a9a0;--gold:#d7aa4a;--ember:#c65b3d;--line:#4d384e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#351d3a,transparent 35%),var(--bg);color:var(--ink);font-family:Georgia,serif}.wrap{max-width:1180px;margin:auto;padding:0 24px}nav{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;text-transform:uppercase;letter-spacing:.04em}.brand b{color:var(--gold)}.btn{background:linear-gradient(135deg,#53321f,#281615);color:#ffeac0;border:1px solid #97703a;border-radius:6px;padding:10px 15px;font:bold .86rem Georgia,serif;cursor:pointer}.btn.alt{background:transparent;border-color:#765a72;color:var(--ink)}.hero{padding:52px 0 25px;display:flex;justify-content:space-between;align-items:end;gap:25px}.eyebrow{color:var(--gold);font-size:.73rem;font-weight:bold;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(2.7rem,6vw,5rem);letter-spacing:-.075em;line-height:.9;margin:10px 0}.hero p{color:var(--muted);max-width:570px;line-height:1.55}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:15px;padding:25px 0 80px}.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:11px;padding:25px}.panel h2{font-size:1.2rem;margin:0 0 16px}.quest{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.quest:last-child{border:0}.rune{height:28px;width:28px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold)}.quest b{display:block;font-size:.98rem}.quest span{display:block;color:var(--muted);font-size:.83rem;margin-top:4px;line-height:1.4}.tag{display:inline-block;border:1px solid #7c5c6e;color:#dabf9a;padding:5px 9px;border-radius:99px;font-size:.78rem}.roster{display:grid;gap:8px}.member{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px;background:#120d14;border:1px solid var(--line);border-radius:7px;font-size:.86rem}.member small{color:var(--muted);display:block;margin-top:3px}.member select{background:#271a2a;color:var(--ink);border:1px solid #795b75;border-radius:5px;padding:6px;font-family:inherit}.empty{padding:90px 0;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.member{grid-template-columns:1fr}.hero{display:block}.wrap{padding:0 16px}}
</style></head><body><main class="wrap"><nav><div class="brand">The <b>Guildhall</b> · Portal</div><a class="btn alt" href="./index.html">Customer site</a></nav><section id="loading" class="empty">Opening the staff portal…</section><section id="app" hidden><header class="hero"><div><div class="eyebrow" id="role">Guild workspace</div><h1 id="title">Your quest board.</h1><p id="subtitle"></p></div><button class="btn alt" id="signout">Sign out</button></header><div class="grid"><section class="panel"><h2 id="questTitle">Today’s quests</h2><div id="quests"></div></section><aside class="panel"><h2 id="sideTitle">Guild intelligence</h2><div id="side"></div></aside></div></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://hdqqpggjrjomnhogrlhq.supabase.co','sb_publishable_JxlklIfK-0O1-9SP2JVnvQ_VfeNqImG');
const q=(t,d)=>'<div class="quest"><div class="rune">✦</div><div><b>'+t+'</b><span>'+d+'</span></div></div>';
async function roster(){const side=document.querySelector('#side');const {data,error}=await sb.from('profiles').select('id,email,display_name,role').order('created_at');if(error){side.innerHTML='<p>'+error.message+'</p>';return}side.innerHTML='<div class="roster">'+data.map(p=>'<div class="member"><div><b>'+((p.display_name||p.email).replace(/</g,'&lt;'))+'</b><small>'+p.email+'</small></div><select id="r-'+p.id+'">'+['customer','staff','team_lead','owner'].map(r=>'<option value="'+r+'" '+(p.role===r?'selected':'')+'>'+r.replace('_',' ')+'</option>').join('')+'</select><button class="btn" onclick="setRole(\''+p.id+'\')">Save</button></div>').join('')+'</div>'}
window.setRole=async id=>{const {error}=await sb.rpc('assign_role',{target_user:id,new_role:document.querySelector('#r-'+id).value});if(error)alert(error.message);else roster()};
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='./index.html';return}const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();const role=p?.role||'customer';if(!['staff','team_lead','owner'].includes(role)){location.href='./index.html';return}document.querySelector('#loading').hidden=true;document.querySelector('#app').hidden=false;document.querySelector('#role').textContent=role.replace('_',' ')+' workspace';let title=document.querySelector('#title'),sub=document.querySelector('#subtitle'),quests=document.querySelector('#quests'),qt=document.querySelector('#questTitle'),st=document.querySelector('#sideTitle'),side=document.querySelector('#side');if(role==='owner'){title.textContent='The guild command table.';sub.textContent='Guide the team, protect the member experience, and give each person the access they need.';qt.textContent='Owner priorities';quests.innerHTML=q('Review the road ahead','Keep every investment tied to real community demand.')+q('Build the founding party','Assign clear leadership as the team grows.')+q('Guard the hall','Set staff access and keep operational decisions organized.');st.textContent='Account roster';await roster()}else if(role==='team_lead'){title.textContent='Lead the next adventure.';sub.textContent='You own the details that make each event feel organized, welcoming, and worth returning to.';qt.textContent='Lead quest board';quests.innerHTML=q('Confirm hosts','Every event needs a clear DM or event owner.')+q('Prepare the hall','Tables, materials, sign-in, and closing checklist.')+q('Brief the party','Share the plan with staff before doors open.');st.textContent='Lead kit';side.innerHTML='<p>Team Leads can coordinate volunteers, event checklists, and their area’s calendar.</p><span class="tag">Team Lead access</span>'}else{title.textContent='Your staff quest board.';sub.textContent='Everything you need for a smooth shift and a great player experience.';qt.textContent='Assigned tasks';quests.innerHTML=q('Welcome the party','Help every new player find their table.')+q('Ready the tables','Check seating, terrain, supplies, and signage.')+q('Close the session','Reset the space and leave notes for the next shift.');st.textContent='Shift kit';side.innerHTML='<p>Shift details, event notes, and checklists will appear here as the calendar grows.</p><span class="tag">Staff access</span>'}}
document.querySelector('#signout').onclick=async()=>{await sb.auth.signOut();location.href='./index.html'};load();
</script></body></html>
